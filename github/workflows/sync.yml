name: 每日同步校招岗位数据

on:
  schedule:
    # cron 使用 UTC 时间，北京时间 = UTC + 8
    # 原站通常在北京时间上午 11 点前后更新，故错开到 12:00 抓取
    - cron: '0 4 * * *'      # 北京时间 12:00
    - cron: '0 10 * * *'     # 北京时间 18:00（当天首次失败时兜底）
  workflow_dispatch:         # 允许在 Actions 页面手动点「Run workflow」
  push:
    branches: [main]         # 改了模板或脚本后推送即重建

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取并生成页面
        run: |
          rm -rf dist
          python fetch_build.py

      - name: 发布到 gh-pages 分支
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          TOTAL=$(python -c "import json;print(json.load(open('meta.json'))['total'])")
          STAMP=$(python -c "import json;print(json.load(open('meta.json'))['updated'])")
          git init -q
          git checkout -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "同步岗位数据 ${TOTAL} 条 · ${STAMP}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            gh-pages
          echo "已发布 ${TOTAL} 条，数据时间 ${STAMP}"

      - name: 确保 GitHub Pages 已开启
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages" \
            -f 'source[branch]=gh-pages' -f 'source[path]=/' 2>/dev/null \
          || gh api -X PUT "repos/${{ github.repository }}/pages" \
            -f 'source[branch]=gh-pages' -f 'source[path]=/' 2>/dev/null \
          || echo "Pages 已开启或需手动确认，跳过"

      - name: 输出摘要
        run: |
          echo "=== 页面产物 ==="
          ls -la dist/
          echo ""
          echo "=== API 接口摘要 ==="
          cat dist/api/meta.json
